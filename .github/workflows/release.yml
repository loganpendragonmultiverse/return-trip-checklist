name: Release build
on:
  push: { tags: ["v*"] }
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: 24 }
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Verify tag and release package
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')"
          test -f dist/return-trip-checklist-1.0.0.zip
          cd dist && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: return-trip-checklist-1.0.0
          path: |
            dist/return-trip-checklist-1.0.0.zip
            dist/SHA256SUMS
          if-no-files-found: error
