name: CodeQL
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279
